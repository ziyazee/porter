services:
  mysql:
    image: mysql:8.0
    container_name: porter-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: porter_db
      MYSQL_USER: porter_user
      MYSQL_PASSWORD: porter_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - porter-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: porter-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/porter_db
      SPRING_DATASOURCE_USERNAME: porter_user
      SPRING_DATASOURCE_PASSWORD: porter_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - porter-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: porter-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - porter-network

volumes:
  mysql_data:
    driver: local

networks:
  porter-network:
    driver: bridge
