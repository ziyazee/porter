spring.application.name=porter

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/porter_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=porter_user
spring.datasource.password=porter_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret=mySecretKeyForPorterApplicationThatIsLongEnoughForHS256Algorithm
jwt.expiration=86400000

# Logging Configuration
logging.level.com.porter.porter=INFO
logging.level.com.porter.porter.otp=INFO
logging.level.com.porter.porter.vehicle=INFO
logging.level.com.porter.porter.driver=INFO
logging.level.com.porter.porter.assignment=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
